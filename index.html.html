<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T A C H I - Official Web Site</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts for Unique Member Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@700;900&family=Fira+Code:wght@700&family=Fredoka:wght@600;700&family=Luckiest+Guy&family=Orbitron:wght@800;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tachi: {
                            purple: '#a855f7',
                            neon: '#f3e8ff',
                            dark: '#020005',
                            bright: '#c084fc',
                            deep: '#581c87'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        bungee: ['Bungee', 'cursive'],
                        gothic: ['Cinzel', 'UnifrakturMaguntia', 'serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                        code: ['"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        ::-webkit-scrollbar { display: none; }

        body {
            background-color: #020005;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Neon Glow Effects */
        .text-glow-purple {
            text-shadow: 0 0 10px #a855f7, 0 0 25px #a855f7, 0 0 50px #c084fc, 0 0 90px #f3e8ff;
        }

        /* 3D Cartoon Text Stroke & Shadow for Runo */
        .cartoon-text-runo {
            font-family: 'Bungee', cursive;
            -webkit-text-stroke: 2px #3b0764;
            text-shadow: 
                4px 4px 0px #020005,
                7px 7px 0px #7e22ce,
                0 0 35px #a855f7;
        }

        /* Gothic Style for Dejares */
        .gothic-text-dejares {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
            text-shadow: 0 0 15px #c084fc, 0 0 30px #a855f7, 0 0 60px #581c87;
        }

        /* Elastic Wave Style for Syronth */
        .elastic-text-syronth {
            font-family: 'Fredoka', sans-serif;
            -webkit-text-stroke: 1.5px #2e1065;
            text-shadow: 0 0 20px #c084fc, 0 0 40px #a855f7;
            animation: elasticWobble 2s infinite ease-in-out;
        }

        @keyframes elasticWobble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03, 0.97); }
        }

        /* Terminal Hacker Style for Mami Bey */
        .code-text-mami {
            font-family: 'Fira Code', monospace;
            color: #f3e8ff;
            text-shadow: 0 0 10px #a855f7, 0 0 25px #c084fc;
        }

        .typing-cursor::after {
            content: '█';
            display: inline-block;
            margin-left: 4px;
            color: #c084fc;
            animation: cursorBlink 0.6s infinite alternate;
        }

        @keyframes cursorBlink {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Fast Title Shake Effect */
        .title-shake-fast {
            animation: fastShake 0.12s infinite alternate ease-in-out;
            display: inline-block;
        }

        @keyframes fastShake {
            0% { transform: scale(1) rotate(-3deg) translate(-4px, -3px); }
            50% { transform: scale(1.1) rotate(3deg) translate(4px, 3px); }
            100% { transform: scale(1.05) rotate(-2deg) translate(2px, -4px); }
        }

        /* Continuous Beat Pulse for Fullscreen Member Image */
        .img-beat-pulse {
            animation: beatPulse 0.7s infinite ease-in-out alternate;
        }

        @keyframes beatPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Screen Flash Impact */
        .flash-impact {
            animation: flashOverlay 0.25s ease-out forwards;
        }

        @keyframes flashOverlay {
            0% { opacity: 0.95; background-color: #f3e8ff; }
            50% { opacity: 0.6; background-color: #a855f7; }
            100% { opacity: 0; background-color: transparent; }
        }

        /* Heart Pop Burst Animation */
        .heart-pop-burst {
            animation: heartPopBurst 0.35s ease-out forwards;
        }

        @keyframes heartPopBurst {
            0% { transform: scale(0.1) rotate(-15deg); opacity: 0; filter: drop-shadow(0 0 60px #ffffff); }
            50% { transform: scale(1.8) rotate(10deg); opacity: 1; filter: drop-shadow(0 0 100px #a855f7); }
            100% { transform: scale(1) rotate(0deg); opacity: 0.95; filter: drop-shadow(0 0 40px #a855f7); }
        }

        /* Dynamic Background Zoom */
        .bg-custom-image {
            background-image: url('https://github.com/user-attachments/assets/915e5cdd-bdb8-4bc1-b794-f6589de90e51');
            background-size: cover;
            background-position: center;
            animation: bgZoom 12s infinite alternate ease-in-out;
        }

        @keyframes bgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-black overflow-hidden select-none">

    <!-- Ambient Background Image & Vignettes -->
    <div class="fixed inset-0 bg-custom-image z-0 opacity-40"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-black via-black/80 to-purple-950/70 z-0 pointer-events-none"></div>
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,transparent_20%,#000000_90%)] z-0 pointer-events-none"></div>

    <!-- Glowing Particle Canvas -->
    <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <!-- Flash Effect Layer -->
    <div id="flash-effect" class="fixed inset-0 z-40 pointer-events-none opacity-0"></div>

    <!-- Invisible Global Audio Trigger Overlay for Unmute Fallback -->
    <div id="audio-unlock-overlay" class="fixed inset-0 z-50 cursor-pointer bg-transparent"></div>

    <!-- Background Audio -->
    <audio id="bg-music" loop preload="auto">
        <source src="LVBEL C5, DYSTINCT - GEL GEL GEL.mp3" type="audio/mpeg">
    </audio>

    <!-- ULTRA FAST AUTOMATIC INTRO OVERLAY -->
    <div id="intro-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-200">
        <canvas id="intro-canvas" class="absolute inset-0 w-full h-full"></canvas>
        
        <!-- Animated Title T A C H I -->
        <div id="title-container" class="relative z-10 flex flex-col items-center opacity-0 transition-all duration-150 transform scale-50 pointer-events-none">
            <h1 id="tachi-title" class="font-orbitron text-7xl sm:text-9xl md:text-[12rem] font-black tracking-[0.25em] text-white text-glow-purple title-shake-fast mb-2">
                T A C H I
            </h1>
        </div>
    </div>

    <!-- MAIN CAROUSEL DISPLAY -->
    <main id="main-content" class="relative z-10 w-full h-full flex items-center justify-center">
        
        <!-- Heart Pop Transition Effect -->
        <div id="heart-transition" class="fixed inset-0 z-30 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-all duration-100 scale-50">
            <div class="relative">
                <i data-lucide="heart" class="w-48 h-48 sm:w-72 sm:h-72 text-tachi-neon fill-tachi-purple heart-pop-burst"></i>
                <div class="absolute inset-0 rounded-full bg-tachi-purple/60 blur-3xl -z-10 animate-ping"></div>
            </div>
        </div>

        <!-- FULLSCREEN SLIDE CONTAINER -->
        <div id="fullscreen-card-container" class="w-full h-full relative flex items-center justify-center overflow-hidden">
            <!-- Member Slides Rendered Dynamically -->
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <footer class="fixed bottom-6 left-0 right-0 z-40 flex justify-between items-center px-8 sm:px-12 pointer-events-none">
        <!-- Prev Button -->
        <button id="prev-btn" aria-label="Previous Slide" class="pointer-events-auto p-4 rounded-full bg-black/70 border border-tachi-purple/60 text-tachi-neon hover:bg-tachi-purple hover:shadow-[0_0_35px_#a855f7] transition-all duration-150 transform hover:scale-110 active:scale-90">
            <i data-lucide="chevron-left" class="w-8 h-8"></i>
        </button>

        <!-- Slide Indicators -->
        <div id="indicators" class="pointer-events-auto flex space-x-3 bg-black/80 px-6 py-3 rounded-full border border-tachi-purple/50 backdrop-blur-md">
            <!-- Dynamic Dots -->
        </div>

        <!-- Next Button -->
        <button id="next-btn" aria-label="Next Slide" class="pointer-events-auto p-4 rounded-full bg-black/70 border border-tachi-purple/60 text-tachi-neon hover:bg-tachi-purple hover:shadow-[0_0_35px_#a855f7] transition-all duration-150 transform hover:scale-110 active:scale-90">
            <i data-lucide="chevron-right" class="w-8 h-8"></i>
        </button>
    </footer>

    <script>
        const teamMembers = [
            {
                roleText: "OWNER OF TACHI : Runo",
                image: "https://github.com/user-attachments/assets/9c4253c7-ac79-41a6-919a-e59db768e1cd",
                styleClass: "cartoon-text-runo",
                typeSpeed: 35
            },
            {
                roleText: "CO - OWNER OF TACHI : Dejares",
                image: "https://github.com/user-attachments/assets/4296a7c7-61f6-4aee-b8cb-41a0af0f0bc5",
                styleClass: "gothic-text-dejares",
                typeSpeed: 45
            },
            {
                roleText: "FOUNDER OF TACHI : Syronth",
                image: "https://github.com/user-attachments/assets/a71b24a6-2cd1-4541-af15-b61c1f52cf00",
                styleClass: "elastic-text-syronth",
                typeSpeed: 40
            },
            {
                roleText: "Developer Mami Bey ?",
                image: "https://github.com/user-attachments/assets/ea472242-21bb-4381-8360-2847a95a489a",
                styleClass: "code-text-mami",
                typeSpeed: 50
            }
        ];

        let currentIndex = 0;
        let isTransitioning = false;
        let autoLoopTimer = null;
        let typingTimeout = null;
        const EDIT_TEMPO_SPEED = 3000; // Tempo for reading typewriter text and looping

        // Audio Handling
        function startImmediateAudio() {
            const bgMusic = document.getElementById('bg-music');
            const unlockOverlay = document.getElementById('audio-unlock-overlay');
            if (!bgMusic) return;

            bgMusic.volume = 1.0;
            
            const tryPlay = () => {
                bgMusic.play().then(() => {
                    if (unlockOverlay) unlockOverlay.remove();
                }).catch(() => {
                    // Browser policy blocked playback, listening for first interaction
                });
            };

            tryPlay();

            // Fallback for browser interaction requirements
            const forceAudioStart = () => {
                bgMusic.play();
                if (unlockOverlay) unlockOverlay.remove();
                window.removeEventListener('click', forceAudioStart);
                window.removeEventListener('touchstart', forceAudioStart);
                window.removeEventListener('mousemove', forceAudioStart);
                window.removeEventListener('keydown', forceAudioStart);
            };

            window.addEventListener('click', forceAudioStart);
            window.addEventListener('touchstart', forceAudioStart);
            window.addEventListener('mousemove', forceAudioStart);
            window.addEventListener('keydown', forceAudioStart);
        }

        // Fast Converging Dashed Lines Canvas Intro Animation
        function runFastConvergingLinesIntro() {
            const canvas = document.getElementById('intro-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const numLines = 16;
            const lines = [];
            for (let i = 0; i < numLines; i++) {
                const angle = (i * (2 * Math.PI / numLines));
                const length = Math.max(canvas.width, canvas.height);
                lines.push({
                    startX: centerX + Math.cos(angle) * length,
                    startY: centerY + Math.sin(angle) * length,
                    angle: angle
                });
            }

            let progress = 0;
            const speed = 0.22; // Fast sweep

            function animateLines() {
                ctx.fillStyle = 'rgba(2, 0, 5, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (progress < 1) {
                    progress += speed;

                    lines.forEach(line => {
                        const currentX = line.startX + (centerX - line.startX) * progress;
                        const currentY = line.startY + (centerY - line.startY) * progress;

                        ctx.save();
                        ctx.setLineDash([20, 10]); // Dashed line pattern (-- -- --)
                        ctx.strokeStyle = '#f3e8ff';
                        ctx.lineWidth = 6;
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = '#a855f7';

                        ctx.beginPath();
                        ctx.moveTo(line.startX, line.startY);
                        ctx.lineTo(currentX, currentY);
                        ctx.stroke();
                        ctx.restore();
                    });

                    requestAnimationFrame(animateLines);
                } else {
                    triggerFlash();

                    // Display Glowing Shaking T A C H I Title
                    const titleContainer = document.getElementById('title-container');
                    titleContainer.classList.remove('opacity-0', 'scale-50');
                    titleContainer.classList.add('opacity-100', 'scale-100');

                    // Fast transition into member cards
                    setTimeout(() => {
                        const overlay = document.getElementById('intro-overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            showMemberWithHypeEdit(0);
                            startAutoLoop();
                        }, 180);
                    }, 400);
                }
            }

            animateLines();
        }

        // Screen Flash Effect
        function triggerFlash() {
            const flash = document.getElementById('flash-effect');
            flash.classList.remove('flash-impact');
            void flash.offsetWidth; // Reflow reset
            flash.classList.add('flash-impact');
        }

        // Particle Canvas Animation
        function initBackgroundParticles() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = Array.from({ length: 60 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3.5 + 1,
                speedY: -Math.random() * 2.5 - 0.5,
                opacity: Math.random() * 0.8 + 0.2
            }));

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.y += p.speedY;
                    if (p.y < 0) p.y = canvas.height;

                    ctx.fillStyle = `rgba(243, 232, 255, ${p.opacity})`;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#a855f7';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animateParticles);
            }
            animateParticles();
        }

        // Typewriter Letter-By-Letter Animation Function
        function typeWriterEffect(element, text, speed) {
            if (typingTimeout) clearTimeout(typingTimeout);
            element.innerHTML = '';
            let charIndex = 0;

            function typeNextChar() {
                if (charIndex < text.length) {
                    element.innerHTML += text.charAt(charIndex);
                    charIndex++;
                    typingTimeout = setTimeout(typeNextChar, speed);
                }
            }

            typeNextChar();
        }

        function renderFullScreenSlide(index) {
            const member = teamMembers[index];
            const container = document.getElementById('fullscreen-card-container');

            container.innerHTML = `
                <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
                    <!-- Fullscreen Member Image -->
                    <img src="${member.image}" alt="${member.roleText}" 
                         class="absolute inset-0 w-full h-full object-cover img-beat-pulse opacity-90"
                         onerror="this.src='https://placehold.co/1920x1080/020005/a855f7?text=TACHI+MEMBER'">
                    
                    <!-- Vignette Overlays -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-black/60"></div>
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_25%,#000000_90%)]"></div>

                    <!-- Typewriter Text Container -->
                    <div class="relative z-20 text-center px-6 max-w-6xl">
                        <h1 id="typewriter-text" class="text-3xl sm:text-5xl md:text-7xl font-black tracking-wider leading-tight uppercase typing-cursor ${member.styleClass}">
                        </h1>
                    </div>
                </div>
            `;

            const textEl = document.getElementById('typewriter-text');
            typeWriterEffect(textEl, member.roleText, member.typeSpeed);

            updateIndicators();
        }

        // Beat-Synced Heart Transition
        function showMemberWithHypeEdit(index) {
            if (isTransitioning) return;
            isTransitioning = true;

            const heartOverlay = document.getElementById('heart-transition');
            const container = document.getElementById('fullscreen-card-container');

            triggerFlash();
            container.style.opacity = '0';

            // Heart Pop
            setTimeout(() => {
                heartOverlay.classList.remove('opacity-0', 'scale-50');
                heartOverlay.classList.add('opacity-100', 'scale-100');
            }, 20);

            // Fast Swap
            setTimeout(() => {
                currentIndex = index;
                renderFullScreenSlide(currentIndex);

                heartOverlay.classList.remove('opacity-100', 'scale-100');
                heartOverlay.classList.add('opacity-0', 'scale-50');

                setTimeout(() => {
                    container.style.opacity = '1';
                    isTransitioning = false;
                }, 60);

            }, 220);
        }

        function updateIndicators() {
            const container = document.getElementById('indicators');
            container.innerHTML = '';
            teamMembers.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `h-3 rounded-full transition-all duration-150 ${idx === currentIndex ? 'bg-tachi-neon w-10 shadow-[0_0_20px_#f3e8ff]' : 'bg-gray-700 w-3 hover:bg-tachi-purple'}`;
                dot.onclick = () => {
                    resetAutoLoop();
                    showMemberWithHypeEdit(idx);
                };
                container.appendChild(dot);
            });
        }

        function startAutoLoop() {
            stopAutoLoop();
            autoLoopTimer = setInterval(() => {
                const nextIdx = (currentIndex + 1) % teamMembers.length;
                showMemberWithHypeEdit(nextIdx);
            }, EDIT_TEMPO_SPEED);
        }

        function stopAutoLoop() {
            if (autoLoopTimer) clearInterval(autoLoopTimer);
        }

        function resetAutoLoop() {
            startAutoLoop();
        }

        // Navigation Controls
        document.getElementById('next-btn').onclick = () => {
            resetAutoLoop();
            const nextIdx = (currentIndex + 1) % teamMembers.length;
            showMemberWithHypeEdit(nextIdx);
        };

        document.getElementById('prev-btn').onclick = () => {
            resetAutoLoop();
            const prevIdx = (currentIndex - 1 + teamMembers.length) % teamMembers.length;
            showMemberWithHypeEdit(prevIdx);
        };

        // Keyboard Arrow Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                document.getElementById('next-btn').click();
            } else if (e.key === 'ArrowLeft') {
                document.getElementById('prev-btn').click();
            }
        });

        window.onload = function() {
            lucide.createIcons();
            startImmediateAudio();
            runFastConvergingLinesIntro();
            initBackgroundParticles();
        };
    </script>
</body>
</html>
